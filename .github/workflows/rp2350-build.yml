name: RP2350 firmware build

on:
  pull_request:
    branches: [rp2350-wifi-upload]
  push:
    branches: [rp2350-wifi-upload, debug/usb-protocol-instrumentation, test/xbox360-wired-portal-id]
  workflow_dispatch:

jobs:
  build-pico2-w:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout PTPE with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install ARM embedded toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build gcc-arm-none-eabi libnewlib-arm-none-eabi build-essential

      - name: Checkout Pico SDK
        uses: actions/checkout@v4
        with:
          repository: raspberrypi/pico-sdk
          ref: 2.1.1
          path: pico-sdk
          submodules: recursive

      - name: Configure for Raspberry Pi Pico 2 W
        env:
          PICO_SDK_PATH: ${{ github.workspace }}/pico-sdk
          PICO_BOARD: pico2_w
        run: cmake -S . -B build-ci -G Ninja -DPICO_BOARD=pico2_w

      - name: Build firmware
        run: cmake --build build-ci --parallel 2

      - name: Upload UF2 artifact
        uses: actions/upload-artifact@v4
        with:
          name: ptpe-rp2350-uf2
          path: build-ci/ptpe.uf2
          if-no-files-found: error
